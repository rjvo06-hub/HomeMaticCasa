<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Calefacción</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
    h1 { font-size: 1.5rem; text-align: center; color: #4da6ff; margin-bottom: 20px; }
    .btn { background: #007aff; color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-bottom: 20px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #333; }
    .title { font-weight: bold; font-size: 1.1rem; color: #ffffff; }
    .subtitle { font-size: 0.85rem; color: #aaa; margin-top: 4px; }
    .error { background: #3a1c1c; border: 1px solid #f44336; padding: 12px; border-radius: 8px; color: #ff8a80; font-size: 0.9rem; }
  </style>
</head>
<body>

  <h1>Control HomeMatic</h1>
  <button class="btn" onclick="loadDevices()">🔄 Actualizar Dispositivos</button>

  <div id="device-list">Cargando...</div>

  <script>
    const CCU_IP = "192.168.178.37";

    async function loadDevices() {
      const container = document.getElementById('device-list');
      container.innerHTML = 'Consultando CCU2 en la red local...';

      const url = `http://${CCU_IP}/api/homematic.cgi`;
      const payload = {
        method: "Device.listAllDetail",
        params: {}
      };

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        const devices = data.result || [];
        container.innerHTML = '';

        if (devices.length === 0) {
          container.innerHTML = '<p>No se encontraron dispositivos en la CCU2.</p>';
          return;
        }

        devices.forEach(dev => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="title">${dev.name || 'Sin Nombre'}</div>
            <div class="subtitle">Modelo: ${dev.type} | ID: ${dev.address}</div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = `
          <div class="error">
            <strong>No se pudo conectar con la CCU2 (${CCU_IP})</strong><br><br>
            Asegúrate de estar conectado al Wi-Fi local de tu casa.
          </div>`;
      }
    }

    loadDevices();
  </script>
</body>
</html>
