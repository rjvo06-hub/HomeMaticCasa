<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Panel HomeMatic</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #fff; padding: 20px; }
    h1 { font-size: 1.4rem; text-align: center; color: #4da6ff; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #333; }
    .title { font-weight: bold; font-size: 1.1rem; color: #ffffff; }
    .subtitle { font-size: 0.85rem; color: #888; margin-top: 4px; }
    .btn { background: #007aff; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>Termostatos HomeMatic</h1>
  <button class="btn" onclick="loadDevices()">🔄 Actualizar Lista</button>
  <div id="device-list">Cargando dispositivos...</div>

  <script>
    async function loadDevices() {
      const container = document.getElementById('device-list');
      container.innerHTML = 'Consultando CCU2 en la red local...';

      const CCU_IP = "192.168.178.37";
      const url = `http://${CCU_IP}/api/homematic.cgi`;

      const payload = {
        method: "Device.listAllDetail",
        params: {}
      };

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        const devices = data.result || [];
        container.innerHTML = '';

        if (devices.length === 0) {
          container.innerHTML = '<p>No se encontraron dispositivos en la CCU2.</p>';
          return;
        }

        devices.forEach(dev => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="title">${dev.name || 'Dispositivo sin nombre'}</div>
            <div class="subtitle">Modelo: ${dev.type} | ID: ${dev.address}</div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = `
          <p style="color:#ff5252">
            No se pudo conectar a http://${CCU_IP}. <br><br>
            Asegúrate de estar en el Wi-Fi de tu casa y de tener la CCU2 encendida.
          </p>`;
      }
    }
    loadDevices();
  </script>
</body>
</html>
